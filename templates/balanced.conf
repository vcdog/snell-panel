DOMAIN-SUFFIX,google.com,🔍 谷歌服务
DOMAIN-KEYWORD,google,🔍 谷歌服务

# Category: private
RULE-SET,LAN,🏠 私有网络
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Lan/Lan.list,🏠 私有网络,update-interval=86400

# Category: china-direct
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list,🔒 国内服务,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/chenyk1219/surge/release/ChinaDomain.list,🔒 国内服务,update-interval=86400
GEOIP,CN,🔒 国内服务

# Category: telegram
RULE-SET,https://raw.githubusercontent.com/Coldvvater/Mononoke/master/Surge/Rules/Telegram.list,📲 电报消息,update-interval=86400

# Category: github
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/GitHub/GitHub.list,🐱 Github,update-interval=86400

# Category: non-china
